/* Layout: four full-height "screens" stacked with soft scroll-snap — a dark projector room first, then warm paper sections, ending in a sunset finale. */
:root{
  --cream:#FBF3EC; --paper:#FFF9F3; --blush:#F4D6D2; --blush-2:#EBC0BB;
  --rose:#9E3B4F; --rose-ink:#5E1F2D; --gold:#C59A4A; --gold-soft:#E7CC94;
  --ink:#3A2A2C; --ink-soft:#7A6164;
  --film:#15100E; --film-2:#221A17; --film-text:#F3E6D8;
  --f-display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --f-hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  --f-body:"Karla","Helvetica Neue",Arial,sans-serif;
  --f-mono:"Courier Prime","Courier New",monospace;
  color-scheme:light;
}

html,body{margin:0;height:100%}
body{background:var(--rose-ink);color:#fff;font-family:var(--f-display);overflow-x:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.screen{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:center;
  padding-block:calc(56px + env(safe-area-inset-top,0px)) calc(56px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{width:100%;max-width:1080px;margin-inline:auto}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase}
h2{margin:0}

.finale-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(94,31,45,.35),rgba(94,31,45,.6) 55%,rgba(58,20,30,.85))}
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.finale-in{position:relative;z-index:2}
.finale-in .eyebrow{color:var(--gold-soft)}
.big-hb{font-family:var(--f-display);font-weight:700;font-size:clamp(46px,10vw,112px);line-height:.95;margin:14px 0 6px;text-wrap:balance;text-shadow:0 6px 30px rgba(0,0,0,.35)}
.big-hb .w{display:inline-block}
.big-hb em{font-family:var(--f-hand);font-style:normal;color:var(--gold-soft)}
.play .big-hb .w{animation:rise .9s cubic-bezier(.2,1,.3,1) both;animation-delay:calc(var(--i) * 90ms)}
@keyframes rise{from{opacity:0;transform:translateY(40px) rotate(4deg)}}
.love{font-family:var(--f-hand);font-size:clamp(30px,5vw,46px);color:#FCE9E4;margin:0}
.play .love{animation:rise 1s .9s both}
.note-card{margin:34px auto 0;max-width:560px;background:rgba(255,249,243,.94);color:var(--rose-ink);border-radius:6px;padding:28px clamp(20px,4vw,40px);box-shadow:0 30px 80px rgba(0,0,0,.35);transform:rotate(-1.2deg)}
.play .note-card{animation:card 1s 1.3s both}
@keyframes card{from{opacity:0;transform:translateY(30px) rotate(3deg)}}
.note-card p{margin:0;font-family:var(--f-display);font-style:italic;font-size:clamp(19px,2.4vw,23px);line-height:1.45}
.note-card .from{display:block;margin-top:12px;font-family:var(--f-hand);font-size:24px;color:var(--rose);font-style:normal}
.again{margin-top:28px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.1);border-radius:999px;padding:10px 20px;font-family:var(--f-hand);font-size:21px;color:#fff;backdrop-filter:blur(4px)}
.again:hover{background:rgba(255,255,255,.22)}


@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<section class="screen" id="finale">
  <div class="finale-bg" aria-hidden="true"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="wrap finale-in" id="finaleIn">
    <div class="eyebrow">For Rik</div>
    <h2 class="big-hb" aria-label="Happy Birthday, My Love!"></h2>
    <p class="love">I Love You So Much! ❤️</p>
    <div class="note-card">
      <p>To the one who holds my heart—wishing you the happiest birthday filled with all the joy, success, and love you bring into my life every single day. Here’s to making endless more memories together!</p>
      <span class="from">— forever yours</span>
    </div>
    <button class="again" id="again">one more time ✨</button>
  </div>
</section>
<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const hb = document.querySelector('.big-hb');
  'Happy|Birthday,|My|Love!'.split('|').forEach((w, i) => { const s = document.createElement('span'); s.className = 'w'; s.style.setProperty('--i', i); s.innerHTML = i >= 2 ? `<em>${w}</em>` : w; hb.appendChild(s); hb.append(' '); });
  const fin = document.getElementById('finale'), finIn = document.getElementById('finaleIn');
  const cv = document.getElementById('confetti'), cx = cv.getContext('2d');
  const colors = ['#E7CC94','#C59A4A','#F4D6D2','#EBC0BB','#FFF9F3','#c4566a'];
  const dpr = Math.min(devicePixelRatio || 1, 2); let parts = [];
  function size(){ cv.width = fin.clientWidth * dpr; cv.height = fin.clientHeight * dpr; }
  function heart(x, y, s){ cx.beginPath(); cx.moveTo(x, y + s*.3); cx.bezierCurveTo(x, y, x - s*.5, y, x - s*.5, y + s*.3); cx.bezierCurveTo(x - s*.5, y + s*.6, x, y + s*.8, x, y + s); cx.bezierCurveTo(x, y + s*.8, x + s*.5, y + s*.6, x + s*.5, y + s*.3); cx.bezierCurveTo(x + s*.5, y, x, y, x, y + s*.3); cx.fill(); }
  function burst(){
    const W = cv.width, H = cv.height;
    for (let n = 0; n < 160; n++){ const a = Math.random()*Math.PI*2, sp = (4 + Math.random()*9) * dpr;
      parts.push({x: W/2, y: H*.42, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 4*dpr, r: (4 + Math.random()*7)*dpr, c: colors[n % colors.length], h: Math.random() < .35, rot: Math.random()*6, vr: (Math.random()-.5)*.3, life: 1}); }
  }
  function ambient(){ if (parts.length < 60) parts.push({x: Math.random()*cv.width, y: cv.height + 20, vx: (Math.random()-.5)*.6, vy: -(0.6 + Math.random()*1.2)*dpr, r: (5 + Math.random()*6)*dpr, c: colors[Math.floor(Math.random()*colors.length)], h: true, rot: 0, vr: 0, life: 1, slow: true}); }
  function loop(){
    cx.clearRect(0, 0, cv.width, cv.height);
    if (Math.random() < .25) ambient();
    parts = parts.filter(p => p.life > 0 && p.y < cv.height + 40 && p.y > -60);
    for (const p of parts){
      if (!p.slow){ p.vy += .18*dpr; p.vx *= .985; p.life -= .006; } else { p.x += Math.sin(p.y/40)*.4; p.life -= .002; }
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      cx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.4)) * (p.slow ? .7 : 1); cx.fillStyle = p.c;
      if (p.h) heart(p.x, p.y, p.r*1.6); else { cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillRect(-p.r/2, -p.r/4, p.r, p.r/2); cx.restore(); }
    }
    requestAnimationFrame(loop);
  }
  function celebrate(){ finIn.classList.remove('play'); void finIn.offsetWidth; finIn.classList.add('play'); if (!reduce) burst(); }
  document.getElementById('again').onclick = celebrate;
  addEventListener('resize', size);
  size(); celebrate(); if (!reduce) loop();
})();
</script>
</body></html>
